# Synonym/Alias Groups for KB Retrieval
# Each group: terms that should match each other during retrieval
# Used by retrieve_kb.py to bridge vocabulary gaps in queries

groups:
  - name: concurrency
    terms: [并发, 同时操作, 并行, concurrent, 多端操作]
  - name: idempotent
    terms: [幂等, 幂等性, idempotent, 重复提交, 重复领取]
  - name: timeout
    terms: [超时, timeout, 请求超时, 连接超时, 超时重试]
  - name: degradation
    terms: [降级, 服务降级, fallback, 熔断, degrade]
  - name: cache_invalidation
    terms: [缓存, cache, 缓存失效, 缓存刷新, 热缓存]
  - name: boundary_value
    terms: [边界值, boundary, 边界, 上下限, 临界值]
  - name: permission
    terms: [权限, permission, 越权, 鉴权, 授权, 权限校验]
  - name: state_machine
    terms: [状态机, 状态流转, 流转, state, 状态转换]
  - name: rollback
    terms: [回退, rollback, 回滚, 撤销, 回退机制]
  - name: reconnect
    terms: [断线重连, 重连, reconnect, 断线, 网络恢复]
  - name: hot_update
    terms: [热更新, hotfix, 热更, 配置更新, 动态更新]
  - name: data_consistency
    terms: [数据一致性, consistency, 一致性, 数据校验]
