# Skill Registry — 能力库可调用技能索引
# 每个 skill 是一个可被主动调用的测试能力，带有触发条件、输入、输出定义
# retrieve_kb.py 和 /kng-test 会读取此文件进行技能路由和选择

skills:
  - id: functional-path-coverage
    file: functional-path-coverage.md
    name: 功能路径覆盖
    when_to_use: 策划案描述了用户操作流程、功能入口、业务场景流转、条件分支
    input: 功能流程描述、用户角色、入口出口
    output: 功能路径测试点（type=functional, id=TP-FP-xxx）
    tags: [功能, 路径, 流程, 主路径, 入口, 操作, 分支]
    covers:
      - 主成功路径
      - 分支路径
      - 循环路径
      - 中断恢复

  - id: boundary-value-design
    file: boundary-value-design.md
    name: 边界值设计
    when_to_use: 策划案涉及数值范围、数量限制、字符串长度、时间范围、百分比
    input: 数值字段、范围约束、数据类型
    output: 边界值测试点（type=boundary, id=TP-BV-xxx）
    tags: [边界值, 上限, 下限, 范围, 数值, 长度, 溢出]
    covers:
      - 最小值最大值
      - 零值空值
      - 越界值
      - 特殊字符
      - 浮点精度

  - id: exception-flow-design
    file: exception-flow-design.md
    name: 异常与容错设计
    when_to_use: 策划案涉及网络操作、服务端交互、外部依赖、资源加载
    input: 服务端交互描述、外部依赖清单、已知异常处理规则
    output: 异常流程测试点（type=exception, id=TP-EX-xxx）
    tags: [异常, 容错, 断网, 超时, 重试, 降级, 弱网, 错误处理]
    covers:
      - 网络异常
      - 服务端错误
      - 依赖服务故障
      - 重试幂等
      - 断线恢复

  - id: state-transition-testing
    file: state-transition-testing.md
    name: 状态流转验证
    when_to_use: 策划案描述了状态变化、条件触发切换、可逆不可逆操作、并发操作
    input: 状态定义、流转规则、触发条件
    output: 状态流转测试点（type=state, id=TP-ST-xxx）
    tags: [状态, 流转, 状态机, 并发, 幂等, 重复提交, 回退]
    covers:
      - 合法状态转换
      - 非法状态跳转
      - 并发冲突
      - 定时状态变更
      - 状态持久化

  - id: permission-security-testing
    file: permission-security-testing.md
    name: 权限与安全测试
    when_to_use: 策划案涉及角色区分、资源归属、功能解锁、敏感操作、数据可见性
    input: 角色权限体系、访问控制规则、敏感操作定义
    output: 权限测试点（type=permission, id=TP-PM-xxx）
    tags: [权限, 安全, 越权, 角色, VIP, 解锁, 认证, 授权]
    covers:
      - 垂直越权
      - 水平越权
      - 解锁条件验证
      - 敏感操作防护

  - id: priority-risk-assessment
    file: priority-risk-assessment.md
    name: 优先级与风险评估
    when_to_use: 其他技能产出测试点后自动调用，用于校准优先级和标注风险
    input: 已生成的测试点列表、项目知识库中的历史风险
    output: 优先级调整建议 + 风险清单 + 待确认清单
    tags: [优先级, 风险, P0, P1, P2, 评审, 评估]
    covers:
      - 优先级分配
      - 风险识别
      - 待确认项提取
      - 测试策略建议

  - id: api-test-automation
    file: api-test-automation.md
    name: 接口自动化设计
    when_to_use: 策划案涉及服务端接口、API交互、数据持久化、多端同步
    input: 接口或协议描述、数据格式、测试框架约定
    output: 接口测试点（type=api, id=TP-API-xxx）+ 脚本规范建议
    tags: [接口测试, API, 自动化, 脚本, 回归, 冒烟, 参数校验, 断言]
    covers:
      - 参数校验
      - 权限验证
      - 业务逻辑断言
      - 幂等性测试
      - 脚本组织规范

# 场景组合模板 — 描述常见测试场景需要哪些 skill 组合
scenarios:
  - name: 奖励/支付结算测试
    description: 涉及金额、道具发放、结算的场景
    required_skills: [functional-path-coverage, boundary-value-design, exception-flow-design, state-transition-testing, api-test-automation]
    extra_tags: [并发, 幂等, 重复领取, 断线重连, 金额校验]
    test_focus:
      - 并发领取幂等性
      - 断线重连后重复结算
      - 金额边界值 (0, 负数, 上限)
      - 多端同时操作

  - name: 配置热更新测试
    description: 运营配置变更后的数据一致性
    required_skills: [functional-path-coverage, boundary-value-design, state-transition-testing]
    extra_tags: [热更新, 配置, 数据一致性, 缓存]
    test_focus:
      - 新旧配置切换时机
      - 缓存失效策略
      - 缺省字段兜底
      - 多语言字段完整性

  - name: 状态机/流程测试
    description: 有状态流转的业务 (任务、战斗、交易)
    required_skills: [functional-path-coverage, state-transition-testing, exception-flow-design, api-test-automation]
    extra_tags: [状态机, 流转, 并发, 回退, 超时]
    test_focus:
      - 状态流转完整性
      - 非法状态跳转
      - 并发状态修改
      - 超时回退机制
      - 状态持久化与恢复

  - name: 权限与安全场景
    description: 涉及角色权限、资源隔离、敏感操作的功能
    required_skills: [permission-security-testing, api-test-automation, functional-path-coverage]
    extra_tags: [越权, 角色, 认证, 资源隔离]
    test_focus:
      - 垂直越权防护
      - 水平越权防护
      - 敏感操作二次确认
      - token 过期与刷新
